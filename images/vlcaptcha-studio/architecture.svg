<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1000" viewBox="0 0 1520 1000" role="img" aria-labelledby="title desc">
<title id="title">VLCaptcha Studio：职责分层与数据流</title><desc id="desc">浏览器负责编辑与恢复，FastAPI 管理版本和后台任务，视觉模型及 Jev 通过适配层生成候选与判断，人工草稿与确认快照独立保存。</desc>
<style>text{font-family:-apple-system,BlinkMacSystemFont,PingFang SC,Microsoft YaHei,Noto Sans CJK SC,sans-serif;fill:#172d42} .muted{fill:#506377} .label{font-size:24px;font-weight:650} .body{font-size:22px} .small{font-size:20px}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#536d86"/></marker></defs>
<rect width="1520" height="1000" rx="24" fill="#f4f7fb"/>
<text x="60" y="65" font-size="36" font-weight="700" fill="#172d42" text-anchor="start">VLCaptcha Studio · 职责分层与数据流</text>
<text x="60" y="103" font-size="23" font-weight="400" fill="#506377" text-anchor="start">模型产物进入候选与判断记录；人工操作决定应用、编辑和确认。</text>
<rect x="60" y="140" width="1400" height="155" rx="16" fill="#eaf3ff" stroke="#b9d3f2" stroke-width="2"/>
<text x="88" y="185" font-size="28" font-weight="700" fill="#172d42" text-anchor="start">浏览器工作区 · React + Konva</text>
<text x="90" y="229" font-size="24" font-weight="600" fill="#172d42" text-anchor="start">原图与候选预览</text>
<text x="90" y="266" font-size="21" font-weight="400" fill="#172d42" text-anchor="start">标签、边框、点位、顺序</text>
<text x="480" y="229" font-size="24" font-weight="600" fill="#172d42" text-anchor="start">EditorSession</text>
<text x="480" y="266" font-size="21" font-weight="400" fill="#172d42" text-anchor="start">base / working / pending</text>
<text x="930" y="229" font-size="24" font-weight="600" fill="#172d42" text-anchor="start">用户明确操作</text>
<text x="930" y="266" font-size="21" font-weight="400" fill="#172d42" text-anchor="start">应用建议 → 编辑 → 确认</text>
<path d="M 470 295 L 470 355" fill="none" stroke="#536d86" stroke-width="3" marker-end="url(#arrow)"/>
<text x="492" y="335" font-size="21" font-weight="400" fill="#172d42" text-anchor="start">HTTP · 保存 / 运行 / 复核</text>
<rect x="60" y="365" width="850" height="280" rx="16" fill="#fff" stroke="#cfdae6" stroke-width="2"/>
<text x="90" y="410" font-size="28" font-weight="700" fill="#172d42" text-anchor="start">FastAPI · 业务与任务层</text>
<rect x="90" y="439" width="360" height="168" rx="16" fill="#f3f8f3" stroke="#bdd7c4" stroke-width="2"/>
<text x="114" y="477" font-size="25" font-weight="650" fill="#172d42" text-anchor="start">编辑与版本事务</text>
<text x="114" y="516" font-size="21" font-weight="400" fill="#172d42" text-anchor="start">版本检查 · 原子保存 · 幂等请求</text>
<text x="114" y="551" font-size="21" font-weight="400" fill="#172d42" text-anchor="start">应用建议 · 确认快照</text>
<text x="114" y="586" font-size="21" font-weight="400" fill="#172d42" text-anchor="start">导入 / 导出 · 复核队列</text>
<rect x="474" y="439" width="405" height="168" rx="16" fill="#fff7e8" stroke="#e3d0a5" stroke-width="2"/>
<text x="498" y="477" font-size="25" font-weight="650" fill="#172d42" text-anchor="start">后台模型任务</text>
<text x="498" y="516" font-size="21" font-weight="400" fill="#172d42" text-anchor="start">两个工作线程 · 单图活动任务约束</text>
<text x="498" y="551" font-size="21" font-weight="400" fill="#172d42" text-anchor="start">候选检测 → 选择判断</text>
<text x="498" y="586" font-size="21" font-weight="400" fill="#172d42" text-anchor="start">局部预览 · 取消 · 失败记录</text>
<rect x="1010" y="365" width="450" height="280" rx="16" fill="#f1edff" stroke="#cfc3ed" stroke-width="2"/>
<text x="1038" y="410" font-size="28" font-weight="700" fill="#172d42" text-anchor="start">可配置模型服务</text>
<text x="1038" y="468" font-size="25" font-weight="650" fill="#172d42" text-anchor="start">视觉模型</text>
<text x="1038" y="504" font-size="21" font-weight="400" fill="#172d42" text-anchor="start">图片 → 对象描述与归一化坐标</text>
<text x="1038" y="561" font-size="25" font-weight="650" fill="#172d42" text-anchor="start">Jev / 兼容判断接口</text>
<text x="1038" y="597" font-size="21" font-weight="400" fill="#172d42" text-anchor="start">题目 + 候选 → 候选 ID</text>
<path d="M 910 505 L 1010 505" fill="none" stroke="#536d86" stroke-width="3" marker-end="url(#arrow)"/>
<text x="960" y="477" font-size="19" font-weight="400" fill="#172d42" text-anchor="middle">适配</text>
<path d="M 1010 584 L 910 584" fill="none" stroke="#536d86" stroke-width="3" marker-end="url(#arrow)"/>
<text x="960" y="621" font-size="19" font-weight="400" fill="#172d42" text-anchor="middle">校验</text>
<path d="M 350 645 L 350 715" fill="none" stroke="#536d86" stroke-width="3" marker-end="url(#arrow)"/>
<text x="373" y="688" font-size="21" font-weight="400" fill="#172d42" text-anchor="start">事务提交</text>
<path d="M 675 645 L 675 715" fill="none" stroke="#536d86" stroke-width="3" marker-end="url(#arrow)"/>
<text x="698" y="688" font-size="21" font-weight="400" fill="#172d42" text-anchor="start">模型产物</text>
<rect x="60" y="725" width="850" height="193" rx="16" fill="#fff" stroke="#cfdae6" stroke-width="2"/>
<text x="90" y="770" font-size="28" font-weight="700" fill="#172d42" text-anchor="start">SQLite + 工作图片</text>
<text x="90" y="812" font-size="22" font-weight="400" fill="#172d42" text-anchor="start">候选集合版本  /  判断记录  /  人工草稿  /  人工确认快照</text>
<text x="90" y="850" font-size="22" font-weight="400" fill="#172d42" text-anchor="start">请求幂等记录  /  模型任务  /  复核状态  /  局部结果</text>
<text x="90" y="889" font-size="21" font-weight="400" fill="#172d42" text-anchor="start">工作图片：规范化 PNG · 尺寸 · SHA-256</text>
<rect x="1010" y="725" width="450" height="193" rx="16" fill="#eaf3ff" stroke="#b9d3f2" stroke-width="2"/>
<text x="1038" y="770" font-size="28" font-weight="700" fill="#172d42" text-anchor="start">浏览器 IndexedDB</text>
<text x="1038" y="812" font-size="22" font-weight="400" fill="#172d42" text-anchor="start">未同步编辑 + 待确认保存请求</text>
<text x="1038" y="850" font-size="22" font-weight="400" fill="#172d42" text-anchor="start">按页面隔离 · 恢复前备份</text>
<text x="1038" y="889" font-size="21" font-weight="400" fill="#172d42" text-anchor="start">独立于服务器数据库</text>
<path d="M 1370 295 L 1490 295 L 1490 695 L 1240 695 L 1240 725" fill="none" stroke="#536d86" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow)"/>
<text x="60" y="963" font-size="22" font-weight="400" fill="#506377" text-anchor="start">当前边界：本地单用户 · 进程内任务执行 · 在线模式调用所配置的模型服务</text>
</svg>